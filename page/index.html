<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>nixpkgs PRs (proof of concept)</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header>
  <h1>nixpkgs open PRs <span class="poc">proof of concept</span></h1>
  <p id="status">Loading the digest…</p>
</header>
<nav id="views" aria-label="Views"></nav>
<search><form id="filters">
  <label>Search <input id="q" type="search" placeholder="title, author, #number"></label>
  <label>Maintainer <input id="maintainer" type="search" placeholder="@handle"></label>
  <label>Bucket <select id="bucket"><option value="">any</option></select></label>
  <label>Branch <select id="base"><option value="">any</option></select></label>
  <label>Rebuilds <select id="rebuilds">
    <option value="">any</option>
    <option value="0">none</option>
    <option value="10">at most 10</option>
    <option value="100">at most 100</option>
    <option value="500">at most 500</option>
  </select></label>
  <label>Label <input id="label" type="search" list="labels" placeholder="nixpkgs label"></label>
  <datalist id="labels"></datalist>
  <label>Sort <select id="sort">
    <option value="">the view's usual</option>
    <option value="updated">oldest update first</option>
    <option value="recent">newest update first</option>
    <option value="created">oldest first</option>
    <option value="small">smallest first</option>
    <option value="rebuilds">fewest rebuilds first</option>
    <option value="approvals">most approvals first</option>
  </select></label>
  <label><input id="hideDrafts" type="checkbox" checked> hide drafts</label>
</form></search>
<main>
  <p id="count"></p>
  <table>
    <thead><tr><th>PR</th><th>Title</th><th>Author</th><th>Size</th><th>CI</th><th>Facts</th><th>Updated</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="more"></p>
</main>
<footer>
  From <a href="https://github.com/iedame/nixkeeper-prs">nixkeeper-prs</a>'s digest.
  Read only: every action happens on GitHub.
</footer>
</body>
</html>
