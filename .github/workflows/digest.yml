name: "Digest: nixpkgs' open PRs"

# Writes the digest (the data branch: data/prs.json, data/meta.json,
# data/diffs.json) of nixpkgs' open pull requests: every one's details
# through GitHub's GraphQL API (with this workflow's own token), what
# nixpkgs has (the channel's index, nixkeeper-hydra's and nixkeeper-updates'
# digests), and small PRs' diffs from github.com, one request a second
# (nixkeeper_prs/cli.py). The data branch is main plus one commit with the
# digest (scripts/data-branch.sh). Run by hand while it's a proof of
# concept.

on:
  workflow_dispatch: {}    # trigger a run from the Actions tab

# One run at a time: a run waits for the last instead of cancelling it.
concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write  # publishes the data branch

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Restore the last published digest, on main
        run: bash scripts/data-branch.sh restore

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # GitHub's GraphQL API has no anonymous access. NIXKEEPER_PRS_TOKEN: a
      # fine-grained token with read-only access to public repositories
      # (5,000 points an hour); without it, this workflow's own token (1,000
      # an hour, about one full sweep).
      - name: Write the digest
        env:
          GITHUB_TOKEN: ${{ secrets.NIXKEEPER_PRS_TOKEN || secrets.GITHUB_TOKEN }}
        run: nix run . -- data

      - name: Publish the digest if it changed
        run: |
          bash scripts/data-branch.sh publish "digest: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
